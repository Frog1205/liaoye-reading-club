name: Deploy liaoye production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liaoye-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Frog1205/liaoye-reading-club' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24.14
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Check repository safety
        run: npm run check:repo:history
      - name: Install locked dependencies
        run: npm ci
      - name: Test local handler
        run: npm test
      - name: Test cloud handler contract
        run: npm test
        env:
          LIAOYE_TEST_CLOUD: '1'
      - name: Build frontend and Worker
        run: npm run build:cloud
      - name: Stamp deployment revision
        run: node cloud/ci-preservation.mjs stamp
      - name: Check existing project, D1 and authentication configuration
        run: node cloud/ci-preservation.mjs before
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy existing Pages project
        run: >-
          npx --no-install wrangler pages deploy dist
          --project-name liaoye-reading --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "GitHub Actions $GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify preserved configuration and live custom domain
        run: node cloud/ci-preservation.mjs after
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
